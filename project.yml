name: OrbitHabit
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.9
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Orbit Habit
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES

targets:
  OrbitHabit:
    type: application
    platform: iOS
    sources:
      - path: OrbitHabit
        excludes:
          - Resources
      - path: OrbitHabit/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbithabit
        PRODUCT_NAME: OrbitHabit
        SWIFT_EMIT_LOC_STRINGS: YES
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/.swiftlint.yml
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "note: SwiftLint is not installed. Run 'brew install swiftlint' to enable static analysis."
          fi

  OrbitHabitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrbitHabitTests
    dependencies:
      - target: OrbitHabit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbithabit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OrbitHabit:
    build:
      targets:
        OrbitHabit: all
        OrbitHabitTests: [test]
    test:
      targets:
        - OrbitHabitTests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
